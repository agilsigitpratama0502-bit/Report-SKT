<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report SKT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <!-- =========================
             HEADER
        ========================== -->
        <div class="header">
            PT. SINAR EMAS KAHURIPAN
        </div>


        <!-- =========================
             INFORMASI UTAMA
        ========================== -->
        <div class="top-section">

            <!-- KIRI -->
            <div class="left-info">

                <div class="row">
                    <div class="label">Gross All</div>
                    <div class="value" id="grossAll">0</div>
                </div>

                <div class="row">
                    <div class="label">Nett All</div>
                    <div class="value" id="nettAll">0</div>
                </div>

                <div class="row">
                    <div class="label">Target All</div>
                    <div class="value" id="targetAll">0</div>
                </div>

                <div class="row">
                    <div class="label">Reject (SC) All</div>
                    <div class="value" id="rejectSc">0</div>
                </div>

                <div class="row">
                    <div class="label">Reject (Presentase)</div>
                    <div class="value" id="rejectPercentage">0%</div>
                </div>

            </div>


            <!-- TENGAH -->
            <div class="middle-info">

    <div class="date" id="tanggal">
        0
    </div>

    <div class="digital-clock" id="digitalClock">
        00:00:00
    </div>

    <div class="target-box">
        Target Box
    </div>

                <div class="target-number" id="targetBox">
                    0
                </div>

            </div>


            <!-- KANAN -->
            <div class="right-info">

                <div class="module-row">

                    <div class="label">
                        Nama Modul
                    </div>

                    <div class="module-value">
                        Modul 1
                    </div>

                    <div class="module-value">
                        Training
                    </div>

                </div>


                <div class="module-row">

                    <div class="label">
                        Gross
                    </div>

                    <div class="value" id="moduleGross">
                        0
                    </div>

                    <div class="value" id="trainingGross">
                        0
                    </div>

                </div>


                <div class="module-row">

                    <div class="label">
                        Nett
                    </div>

                    <div class="value" id="moduleNett">
                        0
                    </div>

                    <div class="value" id="trainingNett">
                        0
                    </div>

                </div>


                <div class="module-row">

                    <div class="label">
                        Presentase
                    </div>

                    <div class="value" id="modulePercentage">
                        0%
                    </div>

                    <div class="value" id="trainingPercentage">
                        0%
                    </div>

                </div>


                <div class="module-row">

                    <div class="label">
                        Berat
                    </div>

                    <div class="empty"></div>

                    <div class="weight" id="weight">
                        0
                    </div>

                </div>

            </div>

        </div>


        <!-- =========================
             TERAKHIR DI INPUT
        ========================== -->
        <div class="section-title">
            TERAKHIR DI INPUT
        </div>


        <div class="last-input">

            <!-- HEADER -->
            <div class="last-row header-row">

                <div>
                    NAMA
                </div>

                <div id="lastName">
                    0
                </div>

                <div>
                    Nett
                </div>

                <div>
                    Gross
                </div>

                <div>
                    R (%)
                </div>

            </div>


            <!-- DATA -->
            <div class="last-row">

                <div class="label">
                    ID
                </div>

                <div id="lastId">
                    0
                </div>

                <div id="lastNett">
                    0
                </div>

                <div id="lastGross">
                    0
                </div>

                <div id="lastPercentage">
                    0%
                </div>

            </div>

        </div>


        <!-- =========================
             GRAFIK
        ========================== -->
        <div class="chart-section">

            <div class="chart-title">
                RIJECT
            </div>


            <div class="chart-container">

                <canvas id="rejectChart"></canvas>

            </div>


            <!-- REJECT -->
            <div class="chart-label reject-label">

                <div class="leader-line"></div>

                <div class="label-text">

                    <strong>
                        RIJECT
                    </strong>

                    <span id="chartReject">
                        0%
                    </span>

                </div>

            </div>


            <!-- NETT -->
            <div class="chart-label nett-label">

                <div class="leader-line"></div>

                <div class="label-text">

                    <strong>
                        NETT
                    </strong>

                    <span id="chartNett">
                        0%
                    </span>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         CHART.JS
    ========================== -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- =========================
         JAVASCRIPT DASHBOARD
    ========================== -->
    <script src="script.js"></script>

</body>

</html>
