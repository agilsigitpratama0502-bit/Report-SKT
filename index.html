<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Report SKT</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #333333;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
           LAYOUT UTAMA
        ========================= */

        .screen {
    width: 100vw;
    height: 100vh;

    display: grid;

    grid-template-columns: 35% 65%;

    gap: 3px;

    background: #ffffff;
}

        /* =========================
           PANEL
        ========================= */

        .panel {
    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #333333;
}

.panel iframe {
    width: 114%;
    height: 114%;

    border: none;

    display: block;

    transform: scale(0.88);
    transform-origin: top left;
}


/* =========================
   VIEW REPORT
   ========================= */

.panel:first-child iframe {
    width: 160%;
    height: 160%;

    transform: scale(0.625);
    transform-origin: top left;
}

        /* =========================
           TV / LAYAR BESAR
        ========================= */

        @media (min-width: 1600px) {

            .screen {
                grid-template-columns: 50% 50%;
                gap: 6px;
            }

        }

        /* =========================
           LAPTOP
        ========================= */

        @media (max-width: 1000px) {

            html,
            body {
                overflow: auto;
            }

            .screen {
                height: auto;
                min-height: 100vh;

                grid-template-columns: 1fr;
            }

            .panel {
                height: 700px;
            }

        }
        /* =========================
   TV DISPLAY
   ========================= */

::-webkit-scrollbar {
    width: 0px;
    height: 0px;
}

html {
    scrollbar-width: none;
}
    </style>

</head>


<body>


    <main class="screen">


        <!-- =========================
             VIEW REPORT
        ========================= -->

        <section class="panel">

            <iframe
                src="view-report.html"
                title="View Report">
            </iframe>

        </section>


        <!-- =========================
             LIST REPORT
        ========================= -->

        <section class="panel">

            <iframe
                src="list-report.html"
                title="List Report">
            </iframe>

        </section>


    </main>


</body>

</html>
